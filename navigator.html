<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#05000a">
    <title>Ternary Navigator</title>
    <style>
        :root {
            --bg-color: #05000a;
            --text-main: #e0dced;
            --ton-color: #4a5fc1; 
            --sil-color: #00ff9d; 
            --qina-color: #ffb000; 
            --accent: #00ff9d; 
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; user-select: none; }
        
        body, html {
            background-color: var(--bg-color);
            color: var(--text-main);
            width: 100%; height: 100%;
            overflow: hidden; 
            transition: background-color 1s ease;
        }

        #cosmos { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }

        #ui {
            position: relative; z-index: 1; height: 100%;
            display: flex; flex-direction: column; padding: 20px;
            background: linear-gradient(180deg, rgba(5,0,10,0.85) 0%, rgba(5,0,10,0.4) 100%);
        }

        h1 {
            font-size: 1.2rem; text-align: center; letter-spacing: 2px;
            color: var(--accent); margin-bottom: 15px;
            text-shadow: 0 0 10px var(--accent); transition: all 1s ease;
        }

        .tide-controls {
            display: flex; justify-content: space-between; margin-bottom: 20px;
            background: rgba(255, 255, 255, 0.05); border-radius: 10px; padding: 5px;
        }
        .tide-btn {
            flex: 1; background: transparent; border: none; color: #555; padding: 10px;
            font-size: 1rem; font-weight: bold; border-radius: 8px; transition: all 0.3s ease;
        }
        .tide-btn.active-ton { color: var(--ton-color); text-shadow: 0 0 8px var(--ton-color); background: rgba(74, 95, 193, 0.1); }
        .tide-btn.active-sil { color: var(--sil-color); text-shadow: 0 0 8px var(--sil-color); background: rgba(0, 255, 157, 0.1); }
        .tide-btn.active-qina { color: var(--qina-color); text-shadow: 0 0 8px var(--qina-color); background: rgba(255, 176, 0, 0.1); }

        .vector-box { margin-bottom: 20px; display: flex; flex-direction: column;}
        .vector-header { display: flex; justify-content: space-between; align-items: center; }
        .vector-header label { font-size: 0.8rem; color: #888; letter-spacing: 1px; }
        
        .north-input-group { display: flex; margin-top: 5px; }
        #true-north {
            flex-grow: 1; background: transparent; border: none; border-bottom: 1px solid var(--accent);
            color: white; font-size: 1.2rem; padding: 5px 0; outline: none; transition: all 1s ease;
        }
        #archive-btn {
            background: transparent; border: 1px solid var(--accent); color: var(--accent);
            border-radius: 5px; padding: 0 15px; margin-left: 10px; font-weight: bold;
        }

        .wake-container { flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; }
        
        #log-input {
            width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2);
            color: white; padding: 12px; border-radius: 5px; outline: none; margin-bottom: 10px;
        }

        /* The Sextant */
        .sextant-controls { display: flex; gap: 5px; margin-bottom: 15px; }
        .sextant-btn {
            flex: 1; padding: 10px; background: rgba(255,255,255,0.1); border: none;
            color: white; border-radius: 5px; font-size: 0.9rem; transition: background 0.3s ease;
        }
        .sextant-btn:active { background: var(--accent); color: black; }

        .log-list { list-style: none; display: flex; flex-direction: column; gap: 10px; padding-bottom: 20px;}
        .log-entry {
            background: rgba(255,255,255,0.03); border-left: 2px solid var(--accent);
            padding: 10px; font-size: 0.9rem; transition: opacity 0.8s ease, transform 0.8s ease;
        }
        .log-entry.dissolving { opacity: 0; transform: translateX(20px); }
        
        .log-header { display: flex; justify-content: space-between; font-size: 0.7rem; color: #666; margin-bottom: 3px; }
        .log-tag { font-size: 0.8rem; }

    </style>
</head>
<body>

    <canvas id="cosmos"></canvas>

    <div id="ui">
        <h1 id="app-title">KAXIM TERMINAL</h1>

        <div class="tide-controls">
            <button class="tide-btn" id="btn-ton" onclick="setTide(-1)">,ton</button>
            <button class="tide-btn active-sil" id="btn-sil" onclick="setTide(0)">.síl</button>
            <button class="tide-btn" id="btn-qina" onclick="setTide(1)">;qına</button>
        </div>

        <div class="vector-box">
            <div class="vector-header">
                <label>TRUE NORTH (ACTIVE VECTOR)</label>
            </div>
            <div class="north-input-group">
                <input type="text" id="true-north" placeholder="Set your horizon..." onchange="saveNorth()">
                <button id="archive-btn" onclick="archiveNorth()">✓</button>
            </div>
        </div>

        <div class="wake-container">
            <input type="text" id="log-input" placeholder="Record your kinetic action...">
            <div class="sextant-controls">
                <button class="sextant-btn" onclick="addLog('North', '⬆️')">⬆️ North</button>
                <button class="sextant-btn" onclick="addLog('Lateral', '↔️')">↔️ Lateral</button>
                <button class="sextant-btn" onclick="addLog('Anchor', '⚓')">⚓ Anchor</button>
            </div>
            <ul class="log-list" id="log-list"></ul>
        </div>
    </div>

    <script>
        // --- PHYSICS STATE ---
        let currentTide = 0; 
        let particleSpeedMult = 1;
        let gravityX = 0;
        let gravityY = 0; // Negative is UP, Positive is DOWN
        
        const colors = { '-1': '#4a5fc1', '0': '#00ff9d', '1': '#ffb000' };

        // --- DOM ELEMENTS ---
        const root = document.documentElement;
        const btnTon = document.getElementById('btn-ton'), btnSil = document.getElementById('btn-sil'), btnQina = document.getElementById('btn-qina');
        const northInput = document.getElementById('true-north');
        const logInput = document.getElementById('log-input');
        const logList = document.getElementById('log-list');

        // --- INITIALIZATION ---
        window.onload = () => {
            if(localStorage.getItem('trueNorth')) northInput.value = localStorage.getItem('trueNorth');
            loadLogs();
            setTide(0); 
        };

        // --- CORE MECHANICS ---
        function setTide(state) {
            currentTide = state;
            root.style.setProperty('--accent', colors[state]);
            btnTon.className = 'tide-btn'; btnSil.className = 'tide-btn'; btnQina.className = 'tide-btn';
            
            if(state === -1) { btnTon.classList.add('active-ton'); particleSpeedMult = 0.3; } 
            else if(state === 0) { btnSil.classList.add('active-sil'); particleSpeedMult = 1.0; } 
            else if(state === 1) { btnQina.classList.add('active-qina'); particleSpeedMult = 2.5; }
        }

        function saveNorth() { localStorage.setItem('trueNorth', northInput.value); }

        function archiveNorth() {
            if(northInput.value.trim() === '') return;
            let archives = JSON.parse(localStorage.getItem('northArchive') || '[]');
            archives.push({ goal: northInput.value, date: new Date().toLocaleDateString() });
            localStorage.setItem('northArchive', JSON.stringify(archives));
            northInput.value = '';
            saveNorth();
            // Flash effect for accomplishment
            document.getElementById('app-title').innerText = "CONSTELLATION SAVED";
            setTimeout(() => { document.getElementById('app-title').innerText = "KAXIM TERMINAL"; }, 2000);
        }

        function addLog(direction, icon) {
            if(logInput.value.trim() === '') return;
            
            // Adjust Particle Gravity based on Sextant
            if(direction === 'North') { gravityX = 0; gravityY = -1.5; } // Drift Up
            else if(direction === 'Lateral') { gravityX = 1.5; gravityY = 0; } // Drift Sideways
            else if(direction === 'Anchor') { gravityX = 0; gravityY = 1.5; } // Sink Down

            const logEntry = {
                id: Date.now(),
                text: logInput.value,
                time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                color: colors[currentTide],
                tag: icon
            };

            let logs = JSON.parse(localStorage.getItem('wakeLogs') || '[]');
            logs.unshift(logEntry); 
            if(logs.length > 50) logs.pop(); 
            localStorage.setItem('wakeLogs', JSON.stringify(logs));

            renderLogs();
            logInput.value = '';
        }

        // --- The kra'solv Mechanic (Long Press to Dissolve) ---
        function attachHoldEvent(li, id) {
            let pressTimer;
            
            const startPress = () => {
                pressTimer = setTimeout(() => {
                    li.classList.add('dissolving');
                    setTimeout(() => { deleteLog(id); }, 800);
                }, 800); // Hold for 0.8 seconds to dissolve
            };
            
            const cancelPress = () => { clearTimeout(pressTimer); };

            li.addEventListener('touchstart', startPress);
            li.addEventListener('touchend', cancelPress);
            li.addEventListener('touchmove', cancelPress);
            li.addEventListener('mousedown', startPress);
            li.addEventListener('mouseup', cancelPress);
            li.addEventListener('mouseleave', cancelPress);
        }

        function deleteLog(id) {
            let logs = JSON.parse(localStorage.getItem('wakeLogs') || '[]');
            logs = logs.filter(log => log.id !== id);
            localStorage.setItem('wakeLogs', JSON.stringify(logs));
            renderLogs();
        }

        function renderLogs() {
            let logs = JSON.parse(localStorage.getItem('wakeLogs') || '[]');
            logList.innerHTML = '';
            logs.forEach(log => {
                const li = document.createElement('li');
                li.className = 'log-entry';
                li.style.borderLeftColor = log.color;
                li.innerHTML = `
                    <div class="log-header">
                        <span>${log.time}</span>
                        <span class="log-tag">${log.tag}</span>
                    </div>
                    <div>${log.text}</div>
                `;
                attachHoldEvent(li, log.id);
                logList.appendChild(li);
            });
        }

        function loadLogs() { renderLogs(); }

        // --- CANVAS PHYSICS (The Compass Environment) ---
        const canvas = document.getElementById('cosmos');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 0.5;
                this.vy = (Math.random() - 0.5) * 0.5;
                this.baseRadius = Math.random() * 2 + 0.5;
            }
            update() {
                // Apply Gravity/Wind from Sextant + Base Speed
                this.x += (this.vx + gravityX) * particleSpeedMult;
                this.y += (this.vy + gravityY) * particleSpeedMult;

                if(this.x < 0) this.x = canvas.width;
                if(this.x > canvas.width) this.x = 0;
                if(this.y < 0) this.y = canvas.height;
                if(this.y > canvas.height) this.y = 0;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.baseRadius, 0, Math.PI * 2);
                ctx.fillStyle = colors[currentTide];
                ctx.globalAlpha = 0.6;
                ctx.fill();
            }
        }

        for(let i=0; i<60; i++) particles.push(new Particle());

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
        animate();

    </script>
</body>
</html>
