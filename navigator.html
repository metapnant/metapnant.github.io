<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#05000a">
    <title>Kaxim Terminal V9</title>
    <style>
        :root {
            --bg-dark: #05000a;
            --bg-panel: #0a0514;
            --text-main: #e0dced;
            --ton: #4a5fc1; 
            --sil: #00ff9d; 
            --qina: #ffb000; 
            --accent: #00ff9d; 
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        body, html {
            background-color: var(--bg-dark); color: var(--text-main);
            width: 100%; height: 100%; overflow: hidden;
            transition: background-color 0.5s ease;
        }

        /* MASSIVE BACKGROUND COMPASS */
        #astrolabe-bg {
            position: fixed; top: 56%; left: 50%; transform: translate(-50%, -50%);
            width: 85vw; height: 85vw; max-width: 350px; max-height: 350px;
            border: 2px dashed rgba(255,255,255,0.05); border-radius: 50%;
            display: flex; justify-content: center; align-items: center; z-index: 0;
            box-shadow: 0 0 40px rgba(0,255,157,0.02); transition: box-shadow 1s ease;
            will-change: box-shadow;
        }
        #target-marker {
            position: absolute; width: 100%; height: 100%; border-radius: 50%;
            transition: transform 1.2s cubic-bezier(0.25, 1, 0.5, 1);
            will-change: transform;
        }
        #target-marker::before {
            content: '▼'; position: absolute; top: -15px; left: calc(50% - 6px);
            color: rgba(255,255,255,0.3); font-size: 12px; text-shadow: 0 0 5px white;
        }
        #astrolabe-center {
            width: 16px; height: 16px; background: var(--bg-dark); border: 2px solid var(--accent);
            border-radius: 50%; box-shadow: 0 0 15px var(--accent); z-index: 2; transition: all 1s ease;
        }
        #astrolabe-needle {
            position: absolute; bottom: 50%; width: 4px; height: 48%;
            background: linear-gradient(to top, transparent, var(--accent));
            transform-origin: bottom center; border-radius: 2px;
            transition: transform 1.2s cubic-bezier(0.25, 1, 0.5, 1), background 1s ease, box-shadow 1s ease;
            box-shadow: 0 0 8px var(--accent);
            will-change: transform, background-color, box-shadow;
        }

        /* TOP UI LAYER */
        #ui-top {
            position: absolute; top: 0; left: 0; width: 100%; z-index: 1;
            padding: 20px; background: linear-gradient(180deg, rgba(5,0,10,0.95) 0%, rgba(5,0,10,0.7) 70%, transparent 100%);
            pointer-events: auto;
        }

        h1 { font-size: 1.1rem; text-align: center; letter-spacing: 4px; color: var(--accent); margin-bottom: 20px; text-shadow: 0 0 5px var(--accent); transition: color 0.5s ease; }
        
        .tide-controls { display: flex; gap: 10px; margin-bottom: 20px; }
        .tide-btn {
            flex: 1; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); color: #666; 
            padding: 12px 10px; font-size: 0.9rem; font-weight: bold; border-radius: 6px; transition: all 0.2s ease;
        }
        .tide-btn.active { color: var(--accent); border-color: var(--accent); background: rgba(255,255,255,0.05); text-shadow: 0 0 10px var(--accent); }

        .horizon-box { background: transparent; padding-bottom: 5px; }
        .horizon-box label { font-size: 0.65rem; color: #888; letter-spacing: 1px; display: block; margin-bottom: 5px;}
        .north-input-group { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed var(--accent); padding-bottom: 5px;}
        #current-goal { color: white; font-size: 1rem; flex-grow: 1; text-transform: uppercase; }
        #set-horizon-btn { background: transparent; border: 1px solid var(--accent); color: var(--accent); border-radius: 4px; padding: 6px 12px; font-size: 0.7rem; font-weight: bold; transition: background 0.2s; }
        #set-horizon-btn:active { background: rgba(0,255,157,0.2); }

        /* WAKE DRAWER (GPU OPTIMIZED) */
        #wake-drawer {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 75vh;
            background: rgba(10,5,15,0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); z-index: 5;
            border-top: 1px solid rgba(255,255,255,0.1); border-radius: 20px 20px 0 0;
            display: flex; flex-direction: column; padding: 0 20px 20px 20px;
            transform: translateY(calc(100% - 110px)); 
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); pointer-events: auto;
            will-change: transform;
        }
        #wake-drawer.open { transform: translateY(0); }
        
        #drawer-touch-zone { padding-top: 10px; padding-bottom: 15px; }
        .drag-handle { width: 40px; height: 5px; background: rgba(255,255,255,0.2); margin: 0 auto; border-radius: 3px; }

        .log-input-group { display: flex; margin-bottom: 15px; flex-shrink: 0;}
        #log-input { flex-grow: 1; background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 15px; border-radius: 8px 0 0 8px; outline: none; }
        #log-input:focus { border-color: var(--accent); }
        #emit-btn { background: var(--accent); color: var(--bg-dark); border: none; font-weight: bold; padding: 0 20px; border-radius: 0 8px 8px 0; transition: filter 0.2s; }
        #emit-btn:active { filter: brightness(0.8); }

        .log-list { list-style: none; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; overflow-x: hidden; padding-bottom: 10px; flex-grow: 1; opacity: 0; transition: opacity 0.3s;}
        #wake-drawer.open .log-list { opacity: 1; }
        
        .log-entry { 
            background: rgba(0,0,0,0.5); border-left: 3px solid var(--accent); padding: 12px; font-size: 0.85rem; 
            backdrop-filter: blur(5px); display: flex; justify-content: space-between; align-items: center;
            will-change: transform, opacity;
        }
        .log-content { flex-grow: 1; pointer-events: none; } 
        .log-header { font-size: 0.65rem; color: #888; margin-bottom: 4px; display: flex; gap: 10px;}
        .delete-btn { color: #555; background: none; border: none; font-size: 1.5rem; padding: 0 10px; transition: color 0.2s; }
        .delete-btn:active { color: #ff4444; }

        /* MODALS */
        .modal-overlay { opacity: 0; pointer-events: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 10; display: flex; justify-content: center; align-items: center; transition: opacity 0.3s ease; backdrop-filter: blur(5px); }
        .modal-overlay.show { opacity: 1; pointer-events: auto; }
        .modal-box { background: var(--bg-panel); border: 1px solid var(--accent); padding: 25px; border-radius: 8px; width: 90%; max-width: 320px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .modal-box p { margin-bottom: 15px; font-size: 0.8rem; color: #aaa; letter-spacing: 1px; font-weight: bold;}
        .modal-input { width: 100%; background: rgba(0,0,0,0.5); border: 1px solid #333; color: white; padding: 12px; margin-bottom: 15px; border-radius: 4px; text-align: center; outline: none;}
        .modal-input:focus { border-color: var(--accent); }
        .modal-btn { display: block; width: 100%; padding: 14px; margin-bottom: 8px; background: rgba(255,255,255,0.05); border: 1px solid #333; color: white; font-size: 0.95rem; border-radius: 4px; font-weight: bold; transition: all 0.2s;}
        .modal-btn:active { background: var(--accent); color: var(--bg-dark); }
        
        /* Compass Grid */
        .compass-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; margin-bottom: 15px; }
        .dir-btn { background: rgba(255,255,255,0.05); border: 1px solid #333; color: white; padding: 12px 0; border-radius: 4px; font-size: 0.85rem; font-weight: bold; transition: all 0.2s;}
        .dir-btn:active { background: var(--accent); color: black;}
        
        .modal-cancel { background: transparent; border: none; color: #888; margin-top: 10px; font-size: 0.85rem; padding: 10px; width: 100%;}
    </style>
</head>
<body>

    <div id="astrolabe-bg">
        <div id="target-marker"></div>
        <div id="astrolabe-needle"></div>
        <div id="astrolabe-center"></div>
    </div>

    <div id="ui-top">
        <h1 id="app-title">KAXIM TERMINAL</h1>
        <div class="tide-controls">
            <button class="tide-btn" id="btn-ton" onclick="setTide(-1)">,ton</button>
            <button class="tide-btn active-sil" id="btn-sil" onclick="setTide(0)">.síl</button>
            <button class="tide-btn" id="btn-qina" onclick="setTide(1)">;qına</button>
        </div>
        <div class="horizon-box">
            <label>CURRENT HORIZON</label>
            <div class="north-input-group">
                <div id="current-goal">No Horizon Set</div>
                <button id="set-horizon-btn" onclick="openHorizonModal()">CHANGE COURSE</button>
            </div>
        </div>
    </div>

    <div id="wake-drawer">
        <div id="drawer-touch-zone">
            <div class="drag-handle"></div>
        </div>
        <div class="log-input-group">
            <input type="text" id="log-input" placeholder="Record kinetic action...">
            <button id="emit-btn" onclick="openSextantModal()">EMIT</button>
        </div>
        <ul class="log-list" id="log-list"></ul>
    </div>

    <div id="horizon-modal" class="modal-overlay">
        <div class="modal-box">
            <p>NAME YOUR HORIZON</p>
            <input type="text" id="goal-input" class="modal-input" placeholder="e.g. Theory Test">
            <p>CHOOSE DIRECTION</p>
            <div class="compass-grid">
                <button class="dir-btn" onclick="setTargetDir(315)">NW</button>
                <button class="dir-btn" onclick="setTargetDir(0)">N</button>
                <button class="dir-btn" onclick="setTargetDir(45)">NE</button>
                <button class="dir-btn" onclick="setTargetDir(270)">W</button>
                <div style="background: transparent;"></div>
                <button class="dir-btn" onclick="setTargetDir(90)">E</button>
                <button class="dir-btn" onclick="setTargetDir(225)">SW</button>
                <button class="dir-btn" onclick="setTargetDir(180)">S</button>
                <button class="dir-btn" onclick="setTargetDir(135)">SE</button>
            </div>
            <button class="modal-cancel" onclick="closeModals()">CANCEL</button>
        </div>
    </div>

    <div id="sextant-modal" class="modal-overlay">
        <div class="modal-box">
            <p>VECTOR ALIGNMENT</p>
            <button class="modal-btn" onclick="submitLog('Align', '⬆️')">⬆️ Align (Toward Horizon)</button>
            <button class="modal-btn" onclick="submitLog('Drift', '↔️')">↔️ Drift (Side Quest)</button>
            <button class="modal-btn" onclick="submitLog('Anchor', '⚓')">⚓ Anchor (Ground/Rest)</button>
            <button class="modal-cancel" onclick="closeModals()">CANCEL</button>
        </div>
    </div>

    <script>
        let currentTide = 0; 
        let needleAngle = 180; 
        let targetAngle = 0; 
        const colors = { '-1': '#4a5fc1', '0': '#00ff9d', '1': '#ffb000' };
        const root = document.documentElement;

        // Drawer Touch Physics
        const drawer = document.getElementById('wake-drawer');
        const touchZone = document.getElementById('drawer-touch-zone');
        let dStartY;
        
        touchZone.addEventListener('touchstart', e => dStartY = e.touches[0].clientY, {passive: true});
        touchZone.addEventListener('touchend', e => {
            let dEndY = e.changedTouches[0].clientY;
            if(dStartY - dEndY > 30) drawer.classList.add('open');
            else if(dEndY - dStartY > 30) drawer.classList.remove('open');
        });

        window.onload = () => {
            if(localStorage.getItem('horizonName')) document.getElementById('current-goal').innerText = localStorage.getItem('horizonName');
            if(localStorage.getItem('needleAngle')) needleAngle = parseFloat(localStorage.getItem('needleAngle'));
            if(localStorage.getItem('targetAngle')) targetAngle = parseFloat(localStorage.getItem('targetAngle'));
            updateCompass(); loadLogs(); setTide(0); 
        };

        function setTide(state) {
            currentTide = state;
            root.style.setProperty('--accent', colors[state]);
            document.querySelectorAll('.tide-btn').forEach(b => b.classList.remove('active'));
            if(state === -1) document.getElementById('btn-ton').classList.add('active');
            if(state === 0) document.getElementById('btn-sil').classList.add('active');
            if(state === 1) document.getElementById('btn-qina').classList.add('active');
            document.getElementById('astrolabe-center').style.borderColor = colors[state];
            document.getElementById('astrolabe-bg').style.boxShadow = `0 0 40px ${colors[state]}15`;
        }

        function openHorizonModal() { document.getElementById('horizon-modal').classList.add('show'); }
        function openSextantModal() { 
            if(document.getElementById('log-input').value.trim() === '') return;
            document.getElementById('sextant-modal').classList.add('show'); 
        }
        function closeModals() { document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('show')); }

        function setTargetDir(deg) {
            let goal = document.getElementById('goal-input').value.trim();
            if(goal === '') goal = "Unknown Horizon";
            targetAngle = deg;
            document.getElementById('current-goal').innerText = goal;
            
            localStorage.setItem('horizonName', goal);
            localStorage.setItem('targetAngle', targetAngle);
            
            updateCompass(); closeModals(); document.getElementById('goal-input').value = '';
        }

        function submitLog(actionType, icon) {
            closeModals();
            let input = document.getElementById('log-input');
            let tideMultiplier = currentTide === -1 ? 0.5 : (currentTide === 1 ? 2.5 : 1.2);
            
            if(actionType === 'Align') {
                let diff = (targetAngle - needleAngle + 540) % 360 - 180;
                let step = 15 * tideMultiplier;
                if(Math.abs(diff) <= step) needleAngle = targetAngle; 
                else needleAngle += Math.sign(diff) * step;
            } else if(actionType === 'Drift') {
                let diff = (needleAngle - targetAngle + 540) % 360 - 180;
                let driftAmount = 20 * tideMultiplier;
                if(Math.abs(diff) < 2) needleAngle += (Math.random() > 0.5 ? 1 : -1) * driftAmount;
                else needleAngle += Math.sign(diff) * driftAmount; 
            } 
            
            needleAngle = (needleAngle + 360) % 360;
            localStorage.setItem('needleAngle', needleAngle);
            updateCompass();

            const logEntry = { id: Date.now(), text: input.value, time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}), color: colors[currentTide], tag: icon };
            let logs = JSON.parse(localStorage.getItem('wakeLogs') || '[]');
            logs.unshift(logEntry); 
            if(logs.length > 50) logs.pop(); 
            localStorage.setItem('wakeLogs', JSON.stringify(logs));

            renderLogs(); input.value = '';
        }

        function updateCompass() {
            document.getElementById('astrolabe-needle').style.transform = `rotate(${needleAngle}deg)`;
            document.getElementById('target-marker').style.transform = `rotate(${targetAngle}deg)`;
            
            if(Math.round(needleAngle) === Math.round(targetAngle)) {
                document.getElementById('app-title').innerText = "HORIZON REACHED";
                document.getElementById('astrolabe-center').style.boxShadow = "0 0 30px white";
            } else {
                document.getElementById('app-title').innerText = "KAXIM TERMINAL";
                document.getElementById('astrolabe-center').style.boxShadow = `0 0 15px ${colors[currentTide]}`;
            }
        }

        function attachSwipeEvent(li, id) {
            let startX = 0, currentX = 0, startY = 0, currentY = 0;
            let isDragging = false;
            let isScrolling = false;

            li.addEventListener('touchstart', e => {
                startX = e.touches[0].clientX; startY = e.touches[0].clientY;
                isDragging = true; isScrolling = false;
                li.style.transition = 'none';
            }, {passive: true});

            li.addEventListener('touchmove', e => {
                if(!isDragging) return;
                currentX = e.touches[0].clientX; currentY = e.touches[0].clientY;
                let diffX = currentX - startX; let diffY = currentY - startY;

                if(Math.abs(diffY) > Math.abs(diffX) + 5) {
                    isScrolling = true; li.style.transform = `translateX(0px)`; return;
                }
                if(!isScrolling) {
                    if(e.cancelable) e.preventDefault();
                    li.style.transform = `translateX(${diffX}px)`;
                    li.style.opacity = 1 - (Math.abs(diffX) / window.innerWidth);
                }
            }, {passive: false});

            li.addEventListener('touchend', e => {
                if(!isDragging || isScrolling) return;
                isDragging = false;
                let diffX = currentX - startX;
                
                li.style.transition = 'transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.3s ease';
                if(Math.abs(diffX) > window.innerWidth * 0.35) { 
                    li.style.transform = `translateX(${Math.sign(diffX) * window.innerWidth}px)`;
                    li.style.opacity = 0;
                    setTimeout(() => { deleteLogRaw(id); }, 300);
                } else { 
                    li.style.transform = `translateX(0px)`; li.style.opacity = 1;
                }
            });
        }

        function deleteLogRaw(id) {
            let logs = JSON.parse(localStorage.getItem('wakeLogs') || '[]');
            logs = logs.filter(log => log.id !== id);
            localStorage.setItem('wakeLogs', JSON.stringify(logs));
            renderLogs();
        }

        function renderLogs() {
            let logs = JSON.parse(localStorage.getItem('wakeLogs') || '[]');
            let list = document.getElementById('log-list'); list.innerHTML = '';
            logs.forEach(log => {
                const li = document.createElement('li'); li.className = 'log-entry'; li.style.borderLeftColor = log.color;
                li.innerHTML = `<div class="log-content"><div class="log-header"><span>${log.time}</span> <span>${log.tag}</span></div><div>${log.text}</div></div><button class="delete-btn" onclick="deleteLogRaw(${log.id})">×</button>`;
                attachSwipeEvent(li, log.id);
                list.appendChild(li);
            });
        }
    </script>
</body>
</html>
