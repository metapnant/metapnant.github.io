<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#05000a">
    <title>Ternary Navigator</title>
    <style>
        :root {
            --bg-dark: #05000a;
            --bg-panel: #0a0514;
            --text-main: #e0dced;
            --ton: #4a5fc1; 
            --sil: #00ff9d; 
            --qina: #ffb000; 
            --accent: #00ff9d; 
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        body, html {
            background-color: var(--bg-dark); color: var(--text-main);
            width: 100%; height: 100%; overflow: hidden;
            transition: background-color 0.5s ease;
        }

        /* CRISP, SOLID ASTROLABE */
        #astrolabe-bg {
            position: fixed; top: 48%; left: 50%; transform: translate(-50%, -50%) scale(1);
            width: 85vw; height: 85vw; max-width: 340px; max-height: 340px;
            background: radial-gradient(circle, rgba(15,10,25,0.9) 0%, rgba(5,0,10,1) 100%);
            border: 2px solid rgba(255,255,255,0.15); border-radius: 50%;
            display: flex; justify-content: center; align-items: center; z-index: 0;
            box-shadow: 0 0 40px rgba(0,0,0,0.8), inset 0 0 20px rgba(255,255,255,0.05);
            transition: top 0.5s cubic-bezier(0.2, 0.8, 0.2, 1), transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 1s ease;
            will-change: transform, top, box-shadow;
        }
        body.drawer-open #astrolabe-bg {
            top: 28%; transform: translate(-50%, -50%) scale(0.55);
        }
        
        #astrolabe-bg::before { content: ''; position: absolute; width: calc(100% + 15px); height: 1px; background: linear-gradient(90deg, rgba(255,255,255,0.4) 0%, transparent 10%, transparent 90%, rgba(255,255,255,0.4) 100%); }
        #astrolabe-bg::after { content: ''; position: absolute; height: calc(100% + 15px); width: 1px; background: linear-gradient(180deg, rgba(255,255,255,0.4) 0%, transparent 10%, transparent 90%, rgba(255,255,255,0.4) 100%); }

        #target-marker { position: absolute; width: 100%; height: 100%; border-radius: 50%; transition: transform 1.2s cubic-bezier(0.25, 1, 0.5, 1); }
        #target-marker::before { content: '▼'; position: absolute; top: -14px; left: calc(50% - 6px); color: #fff; font-size: 14px; text-shadow: 0 0 8px #fff; }
        #astrolabe-center { width: 16px; height: 16px; background: var(--bg-dark); border: 2px solid var(--accent); border-radius: 50%; box-shadow: 0 0 15px var(--accent); z-index: 2; transition: all 1s ease; }
        #astrolabe-needle { position: absolute; bottom: 50%; width: 4px; height: 48%; background: linear-gradient(to top, transparent, var(--accent)); transform-origin: bottom center; border-radius: 2px; transition: transform 1.2s cubic-bezier(0.25, 1, 0.5, 1), background 1s ease, box-shadow 1s ease; box-shadow: 0 0 8px var(--accent); }

        /* TOP UI LAYER */
        #ui-top {
            position: absolute; top: 0; left: 0; width: 100%; z-index: 2;
            padding: 16px 20px 8px 20px; background: linear-gradient(180deg, rgba(5,0,10,0.98) 0%, rgba(5,0,10,0.8) 70%, transparent 100%);
            pointer-events: auto;
        }

        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        h1 { font-size: 1.1rem; letter-spacing: 3px; color: var(--accent); text-shadow: 0 0 5px var(--accent); transition: color 0.5s ease; }
        #sky-toggle-btn { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.2); color: #fff; border-radius: 4px; padding: 6px 12px; font-size: 0.75rem; font-weight: bold; transition: background 0.2s;}
        #sky-toggle-btn:active { background: var(--accent); color: #000; }

        .horizon-box { background: transparent; padding-bottom: 4px; }
        .horizon-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
        .horizon-header label { font-size: 0.65rem; color: #888; letter-spacing: 1px; }
        #resonance-tag { font-size: 0.65rem; color: var(--sil); opacity: 0; transition: opacity 0.5s; letter-spacing: 1px; }
        #resonance-tag.visible { opacity: 1; }

        .north-input-group { display: flex; justify-content: space-between; align-items: center; padding-bottom: 6px;}
        #current-goal { color: white; font-size: 0.95rem; flex-grow: 1; text-transform: uppercase; }
        #set-horizon-btn { background: transparent; border: 1px solid var(--accent); color: var(--accent); border-radius: 4px; padding: 6px 10px; font-size: 0.7rem; font-weight: bold; transition: background 0.2s; }
        #set-horizon-btn:active { background: rgba(0,255,157,0.2); }
        #forge-star-btn { display: none; background: #fff; color: #000; border: none; border-radius: 4px; padding: 6px 10px; font-size: 0.7rem; font-weight: bold; box-shadow: 0 0 10px #fff; }

        .thread-bar { width: 100%; height: 4px; background: rgba(255,255,255,0.08); border-radius: 2px; display: flex; overflow: hidden; margin-top: 4px; }
        #thread-ton, #thread-sil, #thread-qina { height: 100%; transition: width 0.4s ease; width: 0%; }
        #thread-ton { background: var(--ton); } #thread-sil { background: var(--sil); } #thread-qina { background: var(--qina); }

        /* WAKE DRAWER */
        #wake-drawer {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 54vh;
            background: rgba(10,5,15,0.92); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); z-index: 5;
            border-top: 1px solid rgba(255,255,255,0.15); border-radius: 20px 20px 0 0;
            display: flex; flex-direction: column; padding: 0 20px 20px 20px;
            transform: translateY(calc(100% - 90px)); 
            will-change: transform; pointer-events: auto;
        }
        body.drawer-open #wake-drawer { transform: translateY(0); }
        body.drawer-transition #wake-drawer { transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); }
        
        #drawer-touch-zone { padding-top: 14px; padding-bottom: 18px; cursor: pointer; width: 100%; display: flex; justify-content: center; align-items: center; }
        .drag-handle { width: 50px; height: 5px; background: rgba(255,255,255,0.4); border-radius: 3px; }

        .log-input-group { display: flex; margin-bottom: 12px; flex-shrink: 0;}
        #log-input { flex-grow: 1; background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 13px; border-radius: 8px 0 0 8px; outline: none; }
        #log-input:focus { border-color: var(--accent); }
        #emit-btn { background: var(--accent); color: var(--bg-dark); border: none; font-weight: bold; padding: 0 20px; border-radius: 0 8px 8px 0; }

        .log-list { list-style: none; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; overflow-x: hidden; padding-bottom: 10px; flex-grow: 1; }
        
        .log-entry { 
            background: rgba(0,0,0,0.5); border-left: 3px solid var(--accent); padding: 12px; font-size: 0.85rem; 
            backdrop-filter: blur(5px); display: flex; flex-direction: column; word-break: break-word; white-space: pre-wrap;
            will-change: transform, opacity, max-height, padding, margin; max-height: 200px; overflow: hidden;
            transition: max-height 0.3s ease, padding 0.3s ease, margin 0.3s ease, opacity 0.3s ease;
        }
        .log-header { font-size: 0.65rem; color: #888; margin-bottom: 4px; display: flex; gap: 10px;}

        /* CONSTELLATION SKY VIEW */
        #sky-view {
            opacity: 0; pointer-events: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #0a0515 0%, #000 100%); z-index: 10; display: flex; flex-direction: column;
            transition: opacity 0.5s ease;
        }
        #sky-view.active { opacity: 1; pointer-events: auto; }
        .sky-header { position: absolute; top: 0; width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 20px; background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, transparent 100%); z-index: 12;}
        .sky-header h2 { font-size: 1rem; color: #fff; letter-spacing: 3px; }
        #close-sky-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3); color: #fff; border-radius: 4px; padding: 6px 12px; font-size: 0.75rem; font-weight: bold;}
        
        /* Star Physics Layer */
        #star-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; z-index: 11; }
        .star-node {
            position: absolute; display: flex; justify-content: center; align-items: center;
            color: white; transform: translate(-50%, -50%); transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            text-shadow: 0 0 10px currentColor; cursor: pointer;
        }

        /* MODALS */
        .modal-overlay { opacity: 0; pointer-events: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 20; display: flex; justify-content: center; align-items: center; transition: opacity 0.3s ease; backdrop-filter: blur(5px); }
        .modal-overlay.show { opacity: 1; pointer-events: auto; }
        .modal-box { background: var(--bg-panel); border: 1px solid var(--accent); padding: 20px; border-radius: 8px; width: 90%; max-width: 320px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .modal-box p { margin-bottom: 15px; font-size: 0.8rem; color: #aaa; letter-spacing: 1px; font-weight: bold;}
        .modal-input { width: 100%; background: rgba(0,0,0,0.5); border: 1px solid #333; color: white; padding: 12px; margin-bottom: 15px; border-radius: 4px; text-align: center; outline: none;}
        .modal-input:focus { border-color: var(--accent); }
        
        .energy-controls { display: flex; gap: 5px; margin-bottom: 20px; }
        .energy-btn { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid #333; color: #666; padding: 10px; border-radius: 4px; font-weight: bold; font-size: 0.85rem;}
        .energy-btn.active-ton { background: rgba(74, 95, 193, 0.2); color: var(--ton); border-color: var(--ton); }
        .energy-btn.active-sil { background: rgba(0, 255, 157, 0.2); color: var(--sil); border-color: var(--sil); }
        .energy-btn.active-qina { background: rgba(255, 176, 0, 0.2); color: var(--qina); border-color: var(--qina); }

        .modal-btn { display: block; width: 100%; padding: 14px; margin-bottom: 8px; background: rgba(255,255,255,0.05); border: 1px solid #333; color: white; font-size: 0.95rem; border-radius: 4px; font-weight: bold; }
        .modal-btn:active { background: var(--accent); color: var(--bg-dark); }
        .modal-btn.danger { border-color: #ff4444; color: #ff4444; }
        .modal-btn.danger:active { background: #ff4444; color: #000; }
        
        .compass-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; margin-bottom: 15px; }
        .dir-btn { background: rgba(255,255,255,0.05); border: 1px solid #333; color: white; padding: 12px 0; border-radius: 4px; font-size: 0.85rem; font-weight: bold; }
        .dir-btn:active { background: var(--accent); color: black;}
        .modal-cancel { background: transparent; border: none; color: #888; margin-top: 10px; font-size: 0.85rem; padding: 10px; width: 100%;}
    </style>
</head>
<body>

    <div id="astrolabe-bg"><div id="target-marker"></div><div id="astrolabe-needle"></div><div id="astrolabe-center"></div></div>

    <div id="ui-top">
        <div class="header-row">
            <h1 id="app-title">TERNARY NAVIGATOR</h1>
            <button id="sky-toggle-btn" onclick="toggleSky(true)">★ SKY</button>
        </div>
        <div class="horizon-box">
            <div class="horizon-header"><label>CURRENT HORIZON</label><span id="resonance-tag">RESONANCE [rél]</span></div>
            <div class="north-input-group">
                <div id="current-goal">No Horizon Set</div>
                <button id="set-horizon-btn" onclick="checkAbandon()">COURSE</button>
                <button id="forge-star-btn" onclick="forgeStar()">FORGE STAR</button>
            </div>
            <div class="thread-bar"><div id="thread-ton"></div><div id="thread-sil"></div><div id="thread-qina"></div></div>
        </div>
    </div>

    <div id="wake-drawer">
        <div id="drawer-touch-zone"><div class="drag-handle"></div></div>
        <div class="log-input-group">
            <input type="text" id="log-input" placeholder="Record kinetic action...">
            <button id="emit-btn" onclick="openSextantModal()">EMIT</button>
        </div>
        <ul class="log-list" id="log-list"></ul>
    </div>

    <!-- CONSTELLATION SKY VIEW -->
    <div id="sky-view">
        <div class="sky-header"><h2>CONSTELLATION</h2><button id="close-sky-btn" onclick="toggleSky(false)">RETURN</button></div>
        <div id="star-canvas"></div>
    </div>

    <!-- MODALS -->
    <div id="horizon-modal" class="modal-overlay">
        <div class="modal-box">
            <p>NAME YOUR HORIZON</p>
            <input type="text" id="goal-input" class="modal-input" placeholder="e.g. Theory Test">
            <p>CHOOSE DIRECTION</p>
            <div class="compass-grid">
                <button class="dir-btn" onclick="setTargetDir(315)">NW</button><button class="dir-btn" onclick="setTargetDir(0)">N</button><button class="dir-btn" onclick="setTargetDir(45)">NE</button>
                <button class="dir-btn" onclick="setTargetDir(270)">W</button><div style="background: transparent;"></div><button class="dir-btn" onclick="setTargetDir(90)">E</button>
                <button class="dir-btn" onclick="setTargetDir(225)">SW</button><button class="dir-btn" onclick="setTargetDir(180)">S</button><button class="dir-btn" onclick="setTargetDir(135)">SE</button>
            </div>
            <button class="modal-cancel" onclick="closeModals()">CANCEL</button>
        </div>
    </div>

    <div id="abandon-modal" class="modal-overlay">
        <div class="modal-box">
            <p style="color: #ff4444; font-size: 1rem;">ABANDON VOYAGE?</p>
            <p>You have not reached your horizon. Changing course now will dissolve your current wake and progress.</p>
            <button class="modal-btn danger" onclick="confirmAbandon()">ABANDON</button>
            <button class="modal-cancel" onclick="closeModals()">STAY THE COURSE</button>
        </div>
    </div>

    <div id="star-detail-modal" class="modal-overlay">
        <div class="modal-box">
            <h2 id="star-detail-name" style="color: white; margin-bottom: 5px; font-size: 1.2rem;"></h2>
            <p id="star-detail-date" style="color: #888; font-size: 0.7rem; margin-bottom: 20px;"></p>
            <p id="star-detail-stats" style="color: white; font-size: 0.9rem; line-height: 1.5; margin-bottom: 20px;"></p>
            <button class="modal-btn" onclick="closeModals()">CLOSE</button>
        </div>
    </div>

    <div id="sextant-modal" class="modal-overlay">
        <div class="modal-box">
            <p>ENERGY LEVEL</p>
            <div class="energy-controls">
                <button class="energy-btn" id="mod-ton" onclick="selectEnergy(-1)">,ton</button>
                <button class="energy-btn active-sil" id="mod-sil" onclick="selectEnergy(0)">.síl</button>
                <button class="energy-btn" id="mod-qina" onclick="selectEnergy(1)">;qına</button>
            </div>
            <p>VECTOR ALIGNMENT</p>
            <button class="modal-btn" onclick="submitLog('Align', '⬆️')">⬆️ Align (Toward Horizon)</button>
            <button class="modal-btn" onclick="submitLog('Drift', '↔️')">↔️ Drift (Side Quest)</button>
            <button class="modal-btn" onclick="submitLog('Anchor', '⚓')">⚓ Anchor (Ground/Rest)</button>
            <button class="modal-cancel" onclick="closeModals()">CANCEL</button>
        </div>
    </div>

    <script>
        let globalTide = 0; let modalEnergy = 0; let needleAngle = 180; let targetAngle = 0; 
        const colors = { '-1': '#4a5fc1', '0': '#00ff9d', '1': '#ffb000' };
        const root = document.documentElement;

        // Drawer Physics
        const drawer = document.getElementById('wake-drawer');
        const touchZone = document.getElementById('drawer-touch-zone');
        const astrolabe = document.getElementById('astrolabe-bg');
        let dStartY = 0, currentY = 0;
        
        touchZone.addEventListener('touchstart', e => { dStartY = e.touches[0].clientY; currentY = dStartY; drawer.style.transition = 'none'; astrolabe.style.transition = 'box-shadow 1s ease'; }, {passive: true});
        touchZone.addEventListener('touchmove', e => {
            currentY = e.touches[0].clientY;
            let diffY = currentY - dStartY;
            let isOpen = document.body.classList.contains('drawer-open');
            if(!isOpen && diffY < 0) drawer.style.transform = `translateY(calc(100% - 90px + ${diffY}px))`;
            else if(isOpen && diffY > 0) drawer.style.transform = `translateY(${diffY}px)`;
        }, {passive: true});
        touchZone.addEventListener('touchend', e => {
            drawer.style.transition = 'transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1)';
            astrolabe.style.transition = 'top 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 1s ease';
            let diffY = currentY - dStartY;
            let isOpen = document.body.classList.contains('drawer-open');
            if(!isOpen && diffY < -30) document.body.classList.add('drawer-open');
            else if(isOpen && diffY > 30) document.body.classList.remove('drawer-open');
            
            if(document.body.classList.contains('drawer-open')) drawer.style.transform = 'translateY(0)';
            else drawer.style.transform = 'translateY(calc(100% - 90px))';
        });

        window.onload = () => {
            if(localStorage.getItem('horizonName')) document.getElementById('current-goal').innerText = localStorage.getItem('horizonName');
            if(localStorage.getItem('needleAngle')) needleAngle = parseFloat(localStorage.getItem('needleAngle'));
            if(localStorage.getItem('targetAngle')) targetAngle = parseFloat(localStorage.getItem('targetAngle'));
            if(localStorage.getItem('globalTide')) globalTide = parseInt(localStorage.getItem('globalTide'));
            updateCompassUI(); loadLogs(); updateThemeColors(globalTide); updateThreadBar();
        };

        function updateThemeColors(state) {
            root.style.setProperty('--accent', colors[state]);
            document.getElementById('astrolabe-center').style.borderColor = colors[state];
            document.getElementById('astrolabe-bg').style.boxShadow = `0 0 40px ${colors[state]}30`;
        }

        function selectEnergy(state) {
            modalEnergy = state;
            document.getElementById('mod-ton').className = 'energy-btn' + (state === -1 ? ' active-ton' : '');
            document.getElementById('mod-sil').className = 'energy-btn' + (state === 0 ? ' active-sil' : '');
            document.getElementById('mod-qina').className = 'energy-btn' + (state === 1 ? ' active-qina' : '');
        }

        // State Machine
        function checkAbandon() {
            let logs = JSON.parse(localStorage.getItem('wakeLogs') || '[]');
            if (logs.length > 0 && Math.round(needleAngle) !== Math.round(targetAngle) && document.getElementById('current-goal').innerText !== "No Horizon Set") {
                document.getElementById('abandon-modal').classList.add('show');
            } else {
                document.getElementById('horizon-modal').classList.add('show');
            }
        }
        function confirmAbandon() {
            localStorage.setItem('wakeLogs', '[]');
            needleAngle = 180; targetAngle = 0;
            localStorage.setItem('needleAngle', needleAngle);
            loadLogs(); updateThreadBar(); updateCompassUI();
            closeModals(); document.getElementById('horizon-modal').classList.add('show');
        }

        function openSextantModal() { if(document.getElementById('log-input').value.trim() === '') return; selectEnergy(globalTide); document.getElementById('sextant-modal').classList.add('show'); }
        function closeModals() { document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('show')); }

        function setTargetDir(deg) {
            let goal = document.getElementById('goal-input').value.trim();
            if(goal === '') goal = "Unknown Horizon";
            targetAngle = deg; document.getElementById('current-goal').innerText = goal;
            localStorage.setItem('horizonName', goal); localStorage.setItem('targetAngle', targetAngle);
            updateCompassUI(); closeModals(); document.getElementById('goal-input').value = ''; updateThreadBar();
        }

        function updateThreadBar() {
            let logs = JSON.parse(localStorage.getItem('wakeLogs') || '[]');
            let counts = { '-1': 0, '0': 0, '1': 0, 'Align': 0, 'Drift': 0, 'Anchor': 0 };
            logs.forEach(l => { counts[l.energy]++; counts[l.actionType]++; });
            
            let total = logs.length;
            if(total === 0) {
                document.getElementById('thread-ton').style.width = '0%'; document.getElementById('thread-sil').style.width = '0%'; document.getElementById('thread-qina').style.width = '0%';
                document.getElementById('resonance-tag').classList.remove('visible'); return;
            }
            let tonPct = (counts['-1'] / total) * 100; let silPct = (counts['0'] / total) * 100; let qinaPct = (counts['1'] / total) * 100;
            document.getElementById('thread-ton').style.width = tonPct + '%'; document.getElementById('thread-sil').style.width = silPct + '%'; document.getElementById('thread-qina').style.width = qinaPct + '%';

            let isResonant = counts['-1'] > 0 && counts['0'] > 0 && counts['1'] > 0 && tonPct > 15 && silPct > 15 && qinaPct > 15;
            if(isResonant) document.getElementById('resonance-tag').classList.add('visible');
            else document.getElementById('resonance-tag').classList.remove('visible');
        }

        function submitLog(actionType, icon) {
            closeModals(); let input = document.getElementById('log-input');
            globalTide = modalEnergy; localStorage.setItem('globalTide', globalTide); updateThemeColors(globalTide);
            let tideMultiplier = globalTide === -1 ? 0.5 : (globalTide === 1 ? 2.5 : 1.2);
            let currentMod = ((needleAngle % 360) + 360) % 360; let targetMod = ((targetAngle % 360) + 360) % 360;

            if(actionType === 'Align') {
                let diff = (targetMod - currentMod + 540) % 360 - 180;
                let step = 15 * tideMultiplier;
                if(Math.abs(diff) <= step) needleAngle += diff; else needleAngle += Math.sign(diff) * step;
            } else if(actionType === 'Drift') {
                let diffToSouth = ((targetMod + 180 - currentMod) + 540) % 360 - 180;
                let step = 20 * tideMultiplier;
                if (Math.abs(diffToSouth) === 180) needleAngle += (Math.random() > 0.5 ? 1 : -1) * step;
                else if (Math.abs(diffToSouth) <= step) needleAngle += diffToSouth + (Math.sign(diffToSouth || 1) * 3); 
                else needleAngle += Math.sign(diffToSouth) * step;
            } 
            needleAngle = (needleAngle + 360) % 360;
            localStorage.setItem('needleAngle', needleAngle); updateCompassUI();

            const logEntry = { id: Date.now(), text: input.value, time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}), color: colors[globalTide], energy: globalTide.toString(), tag: icon, actionType: actionType };
            let logs = JSON.parse(localStorage.getItem('wakeLogs') || '[]');
            logs.unshift(logEntry); localStorage.setItem('wakeLogs', JSON.stringify(logs));
            renderSingleLog(logEntry, true); updateThreadBar(); input.value = '';
        }

        function updateCompassUI() {
            document.getElementById('astrolabe-needle').style.transform = `rotate(${needleAngle}deg)`;
            document.getElementById('target-marker').style.transform = `rotate(${targetAngle}deg)`;
            let currentMod = Math.round(((needleAngle % 360) + 360) % 360); let targetMod = Math.round(((targetAngle % 360) + 360) % 360);

            if(currentMod === targetMod && document.getElementById('current-goal').innerText !== "No Horizon Set") {
                document.getElementById('app-title').innerText = "HORIZON ALIGNED";
                document.getElementById('astrolabe-center').style.boxShadow = "0 0 30px #fff"; document.getElementById('astrolabe-center').style.backgroundColor = "#fff";
                document.getElementById('set-horizon-btn').style.display = 'none'; document.getElementById('forge-star-btn').style.display = 'block';
            } else {
                document.getElementById('app-title').innerText = "TERNARY NAVIGATOR";
                document.getElementById('astrolabe-center').style.boxShadow = `0 0 15px ${colors[globalTide]}`; document.getElementById('astrolabe-center').style.backgroundColor = "#05000a";
                document.getElementById('set-horizon-btn').style.display = 'block'; document.getElementById('forge-star-btn').style.display = 'none';
            }
        }

        // --- CONSTELLATION FORGING ---
        function forgeStar() {
            let horizon = localStorage.getItem('horizonName') || "Unknown Voyage";
            let logs = JSON.parse(localStorage.getItem('wakeLogs') || '[]');
            
            let counts = { '-1': 0, '0': 0, '1': 0, 'Align': 0, 'Drift': 0, 'Anchor': 0 };
            logs.forEach(l => { counts[l.energy]++; counts[l.actionType]++; });
            
            let dominantEnergy = Object.keys({'-1': counts['-1'], '0': counts['0'], '1': counts['1']}).reduce((a, b) => counts[a] > counts[b] ? a : b);
            
            // Star Shape Logic
            let isResonant = counts['-1'] > 0 && counts['0'] > 0 && counts['1'] > 0;
            let starGlyph = '★';
            if (counts['Anchor'] > counts['Align'] && counts['Anchor'] > counts['Drift']) starGlyph = '✪'; // Stable/Dense
            else if (counts['Drift'] > counts['Align'] && counts['Drift'] > counts['Anchor']) starGlyph = '✺'; // Chaotic
            else if (isResonant || counts['Align'] > counts['Drift']) starGlyph = '✦'; // Focused/Resonant

            let newStar = {
                id: Date.now(), name: horizon, glyph: starGlyph, color: colors[dominantEnergy],
                date: new Date().toLocaleDateString(), actionsCount: logs.length,
                stats: `Energy Focus: ${dominantEnergy == -1 ? 'Ground' : dominantEnergy == 0 ? 'Flow' : 'Fire'}<br>Dominant Action: ${counts['Align'] >= counts['Drift'] ? 'Aligned' : 'Drifted'}`
            };

            let stars = JSON.parse(localStorage.getItem('constellationStars') || '[]');
            stars.unshift(newStar); localStorage.setItem('constellationStars', JSON.stringify(stars));

            // Reset
            localStorage.setItem('wakeLogs', '[]'); localStorage.removeItem('horizonName');
            needleAngle = 180; targetAngle = 0; localStorage.setItem('needleAngle', needleAngle);
            document.getElementById('current-goal').innerText = "No Horizon Set";
            loadLogs(); updateThreadBar(); updateCompassUI(); toggleSky(true);
        }

        function toggleSky(open) {
            const sky = document.getElementById('sky-view');
            if(open) { renderSky(); sky.classList.add('active'); } else { sky.classList.remove('active'); }
        }

        function renderSky() {
            const canvas = document.getElementById('star-canvas'); canvas.innerHTML = '';
            let stars = JSON.parse(localStorage.getItem('constellationStars') || '[]');
            if(stars.length === 0) { canvas.innerHTML = '<div style="color:#555; text-align:center; padding-top: 50vh;">The sky is empty.<br>Align a horizon to forge a star.</div>'; return; }

            stars.forEach(s => {
                const starEl = document.createElement('div');
                starEl.className = 'star-node';
                starEl.style.color = s.color;
                starEl.innerHTML = s.glyph;
                // Calculate random position but keep within 10-90% to avoid edges
                let randX = Math.floor(Math.random() * 80) + 10;
                let randY = Math.floor(Math.random() * 80) + 10;
                starEl.style.left = randX + '%'; starEl.style.top = randY + '%';
                
                // Size based on logs
                let size = Math.min(60, 20 + (s.actionsCount * 1.5));
                starEl.style.fontSize = size + 'px';
                starEl.style.textShadow = `0 0 ${size/2}px currentColor`;

                // Drag Physics
                let isDragging = false, startX, startY, origX, origY;
                starEl.addEventListener('touchstart', e => {
                    isDragging = true; startX = e.touches[0].clientX; startY = e.touches[0].clientY;
                    origX = 0; origY = 0; starEl.style.transition = 'none';
                });
                starEl.addEventListener('touchmove', e => {
                    if(!isDragging) return;
                    let dx = e.touches[0].clientX - startX; let dy = e.touches[0].clientY - startY;
                    starEl.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
                });
                starEl.addEventListener('touchend', e => {
                    isDragging = false;
                    // Snap back physics
                    starEl.style.transition = 'transform 0.5s cubic-bezier(0.25, 1.5, 0.5, 1)';
                    starEl.style.transform = 'translate(-50%, -50%)';
                });

                // Tap for details (if not dragged)
                starEl.addEventListener('click', () => {
                    document.getElementById('star-detail-name').innerText = s.name;
                    document.getElementById('star-detail-date').innerText = `${s.date} · ${s.actionsCount} Actions`;
                    document.getElementById('star-detail-stats').innerHTML = s.stats;
                    document.getElementById('star-detail-modal').classList.add('show');
                });
                canvas.appendChild(starEl);
            });
        }

        // --- SWIPE DELETE ---
        function attachSwipeToDelete(li, id) {
            let startX = 0, currentX = 0, startY = 0, currentY = 0;
            let isDragging = false, isScrolling = false;

            li.addEventListener('touchstart', e => {
                startX = e.touches[0].clientX; currentX = startX; startY = e.touches[0].clientY; currentY = startY;
                isDragging = true; isScrolling = false; li.style.transition = 'none';
            }, {passive: true});
            li.addEventListener('touchmove', e => {
                if(!isDragging) return;
                currentX = e.touches[0].clientX; currentY = e.touches[0].clientY;
                if(Math.abs(currentY - startY) > Math.abs(currentX - startX) + 6) { isScrolling = true; li.style.transform = 'translateX(0px)'; return; }
                if(!isScrolling) { if(e.cancelable) e.preventDefault(); li.style.transform = `translateX(${currentX - startX}px)`; li.style.opacity = Math.max(0.1, 1 - (Math.abs(currentX - startX) / (window.innerWidth * 0.7))); }
            }, {passive: false});
            li.addEventListener('touchend', e => {
                if(!isDragging || isScrolling) return;
                isDragging = false; let diffX = currentX - startX;
                if(Math.abs(diffX) > window.innerWidth * 0.35) {
                    li.style.transition = 'transform 0.25s ease-out, opacity 0.25s ease-out, max-height 0.3s ease 0.15s, padding 0.3s ease 0.15s, margin 0.3s ease 0.15s';
                    li.style.transform = `translateX(${Math.sign(diffX) * window.innerWidth}px)`; li.style.opacity = '0'; li.style.maxHeight = '0px'; li.style.paddingTop = '0px'; li.style.paddingBottom = '0px'; li.style.marginTop = '0px'; li.style.marginBottom = '0px';
                    setTimeout(() => { let logs = JSON.parse(localStorage.getItem('wakeLogs') || '[]'); logs = logs.filter(log => log.id !== id); localStorage.setItem('wakeLogs', JSON.stringify(logs)); li.remove(); updateThreadBar(); }, 450);
                } else { li.style.transition = 'transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.25s ease'; li.style.transform = 'translateX(0px)'; li.style.opacity = '1'; }
            });
        }

        function renderSingleLog(log, prepend = false) {
            const li = document.createElement('li'); li.className = 'log-entry'; li.style.borderLeftColor = log.color;
            li.innerHTML = `<div class="log-content"><div class="log-header"><span>${log.time}</span> <span>${log.tag}</span></div><div>${log.text}</div></div>`;
            attachSwipeToDelete(li, log.id);
            if(prepend) document.getElementById('log-list').prepend(li);
            else document.getElementById('log-list').appendChild(li);
        }

        function loadLogs() {
            let logs = JSON.parse(localStorage.getItem('wakeLogs') || '[]');
            document.getElementById('log-list').innerHTML = '';
            logs.forEach(log => renderSingleLog(log));
        }
    </script>
