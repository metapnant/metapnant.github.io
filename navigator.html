<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#05000a">
    <title>Kaxim Terminal V4</title>
    <style>
        :root {
            --bg-dark: #05000a;
            --bg-panel: #0a0514;
            --text-main: #e0dced;
            --ton: #4a5fc1; 
            --sil: #00ff9d; 
            --qina: #ffb000; 
            --accent: #00ff9d; 
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; user-select: none; }
        
        body, html {
            background-color: var(--bg-dark); color: var(--text-main);
            width: 100%; height: 100%; overflow: hidden;
            transition: background-color 0.5s ease;
        }

        #ui {
            height: 100%; display: flex; flex-direction: column; padding: 20px;
        }

        h1 {
            font-size: 1.1rem; text-align: center; letter-spacing: 3px;
            color: var(--accent); margin-bottom: 15px; text-shadow: 0 0 5px var(--accent);
            transition: color 0.5s ease;
        }

        /* TIDE CONTROLS */
        .tide-controls { display: flex; gap: 10px; margin-bottom: 20px; }
        .tide-btn {
            flex: 1; background: var(--bg-panel); border: 1px solid #222; color: #555; 
            padding: 10px; font-size: 1rem; font-weight: bold; border-radius: 4px; transition: all 0.3s ease;
        }
        .tide-btn.active-ton { color: var(--ton); border-color: var(--ton); background: rgba(74, 95, 193, 0.15); box-shadow: 0 0 10px rgba(74,95,193,0.2); }
        .tide-btn.active-sil { color: var(--sil); border-color: var(--sil); background: rgba(0, 255, 157, 0.15); box-shadow: 0 0 10px rgba(0,255,157,0.2); }
        .tide-btn.active-qina { color: var(--qina); border-color: var(--qina); background: rgba(255, 176, 0, 0.15); box-shadow: 0 0 10px rgba(255,176,0,0.2); }

        /* THE COMPASS & HORIZON */
        .dashboard {
            background: var(--bg-panel); padding: 15px; border-radius: 4px; 
            margin-bottom: 15px; border: 1px solid #222; display: flex; align-items: center; justify-content: space-between;
        }
        .horizon-data { flex-grow: 1; }
        .horizon-data label { font-size: 0.65rem; color: #888; letter-spacing: 1px; display: block; margin-bottom: 5px;}
        .north-input-group { display: flex; gap: 10px; margin-bottom: 10px; }
        #true-north {
            flex-grow: 1; background: transparent; border: none; border-bottom: 1px dashed var(--accent);
            color: white; font-size: 1rem; padding: 5px 0; outline: none; width: 60%;
        }
        #distance-input {
            width: 40px; background: transparent; border: none; border-bottom: 1px dashed var(--accent);
            color: var(--accent); font-size: 1rem; text-align: center; outline: none;
        }
        #archive-btn {
            background: transparent; border: 1px solid var(--accent); color: var(--accent);
            border-radius: 4px; padding: 0 12px; font-weight: bold;
        }
        
        .distance-display { font-size: 0.8rem; color: #aaa; }
        .distance-display span { color: var(--accent); font-weight: bold; font-size: 1.1rem; }

        /* THE ASTROLABE (Visual Compass) */
        .compass-container {
            width: 60px; height: 60px; border: 2px solid #333; border-radius: 50%;
            position: relative; margin-left: 15px; display: flex; justify-content: center; align-items: center;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
        .compass-needle {
            width: 2px; height: 25px; background: var(--accent);
            position: absolute; bottom: 50%; transform-origin: bottom center;
            border-radius: 2px; transition: transform 1.5s cubic-bezier(0.25, 1, 0.5, 1), background 0.5s ease, box-shadow 0.5s ease;
            box-shadow: 0 0 5px var(--accent);
        }
        .compass-center {
            width: 6px; height: 6px; background: white; border-radius: 50%; z-index: 2;
        }

        /* WAKE LOG */
        .wake-container { flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; }
        .log-input-group { display: flex; margin-bottom: 15px; }
        #log-input {
            flex-grow: 1; background: var(--bg-panel); border: 1px solid #333; color: white;
            padding: 15px; border-radius: 4px 0 0 4px; outline: none;
        }
        #emit-btn {
            background: var(--accent); color: var(--bg-dark); border: none; font-weight: bold;
            padding: 0 20px; border-radius: 0 4px 4px 0; transition: background 0.3s ease;
        }

        /* LOG ENTRIES */
        .log-list { list-style: none; display: flex; flex-direction: column; gap: 8px; padding-bottom: 20px;}
        .log-entry {
            background: var(--bg-panel); border-left: 3px solid var(--accent);
            padding: 10px; font-size: 0.85rem; display: flex; justify-content: space-between; align-items: flex-start;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }
        .log-entry.dissolving { opacity: 0; transform: scale(0.95); }
        .log-content { flex-grow: 1; }
        .log-header { font-size: 0.65rem; color: #666; margin-bottom: 4px; }
        .delete-btn { color: #555; background: none; border: none; font-size: 1.2rem; padding-left: 15px; }
        .delete-btn:active { color: #ff4444; }

        /* SEXTANT POPUP (Fade In) */
        #modal-overlay {
            opacity: 0; pointer-events: none;
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 10; display: flex; justify-content: center; align-items: center;
            transition: opacity 0.3s ease;
        }
        #modal-overlay.show { opacity: 1; pointer-events: auto; }
        .modal-box {
            background: var(--bg-panel); border: 1px solid var(--accent); padding: 20px;
            border-radius: 4px; width: 90%; max-width: 320px; text-align: center;
        }
        .modal-box p { margin-bottom: 15px; font-size: 0.8rem; color: #aaa; letter-spacing: 1px;}
        .modal-btn {
            display: block; width: 100%; padding: 12px; margin-bottom: 8px;
            background: rgba(255,255,255,0.05); border: 1px solid #333; color: white;
            font-size: 0.9rem; border-radius: 4px;
        }
        .modal-btn:active { background: var(--accent); color: var(--bg-dark); }
        .modal-cancel { background: transparent; border: none; color: #666; margin-top: 10px; font-size: 0.8rem; }

    </style>
</head>
<body>

    <div id="ui">
        <h1 id="app-title">KAXIM TERMINAL</h1>

        <div class="tide-controls">
            <button class="tide-btn" id="btn-ton" onclick="setTide(-1)">,ton</button>
            <button class="tide-btn active-sil" id="btn-sil" onclick="setTide(0)">.síl</button>
            <button class="tide-btn" id="btn-qina" onclick="setTide(1)">;qına</button>
        </div>

        <div class="dashboard">
            <div class="horizon-data">
                <label>TRUE NORTH & DISTANCE</label>
                <div class="north-input-group">
                    <input type="text" id="true-north" placeholder="Horizon..." onchange="saveData()">
                    <input type="number" id="distance-input" placeholder="100" onchange="saveData()">
                    <button id="archive-btn" onclick="archiveNorth()">⇡</button>
                </div>
                <div class="distance-display">Distance Remaining: <span id="dist-display">0</span></div>
            </div>
            <div class="compass-container" id="compass-box">
                <div class="compass-needle" id="needle"></div>
                <div class="compass-center"></div>
            </div>
        </div>

        <div class="wake-container">
            <div class="log-input-group">
                <input type="text" id="log-input" placeholder="Record kinetic action...">
                <button id="emit-btn" onclick="openModal()">EMIT</button>
            </div>
            <ul class="log-list" id="log-list"></ul>
        </div>
    </div>

    <!-- SEXTANT POPUP -->
    <div id="modal-overlay">
        <div class="modal-box">
            <p>SET VECTOR ALIGNMENT</p>
            <button class="modal-btn" onclick="submitLog('North', '⬆️')">⬆️ North (Mountain)</button>
            <button class="modal-btn" onclick="submitLog('Lateral', '↔️')">↔️ Lateral (Ocean)</button>
            <button class="modal-btn" onclick="submitLog('Anchor', '⚓')">⚓ Anchor (Ground)</button>
            <button class="modal-cancel" onclick="closeModal()">Cancel</button>
        </div>
    </div>

    <script>
        let currentTide = 0; 
        const colors = { '-1': '#4a5fc1', '0': '#00ff9d', '1': '#ffb000' };
        let lateralToggle = 1; // Used to swing compass left or right
        
        const root = document.documentElement;
        const distInput = document.getElementById('distance-input');
        const distDisplay = document.getElementById('dist-display');
        const needle = document.getElementById('needle');
        
        window.onload = () => {
            if(localStorage.getItem('trueNorth')) document.getElementById('true-north').value = localStorage.getItem('trueNorth');
            if(localStorage.getItem('northDist')) distInput.value = localStorage.getItem('northDist');
            updateDisplay();
            loadLogs();
            setTide(0); 
        };

        function setTide(state) {
            currentTide = state;
            root.style.setProperty('--accent', colors[state]);
            document.getElementById('btn-ton').className = 'tide-btn' + (state === -1 ? ' active-ton' : '');
            document.getElementById('btn-sil').className = 'tide-btn' + (state === 0 ? ' active-sil' : '');
            document.getElementById('btn-qina').className = 'tide-btn' + (state === 1 ? ' active-qina' : '');
            document.getElementById('compass-box').style.borderColor = colors[state];
        }

        function saveData() { 
            localStorage.setItem('trueNorth', document.getElementById('true-north').value); 
            localStorage.setItem('northDist', distInput.value);
            updateDisplay();
        }

        function updateDisplay() {
            let d = parseFloat(distInput.value) || 0;
            distDisplay.innerText = d.toFixed(1);
        }

        function archiveNorth() {
            let input = document.getElementById('true-north');
            if(input.value.trim() === '') return;
            let archives = JSON.parse(localStorage.getItem('northArchive') || '[]');
            archives.push({ goal: input.value, distanceRemaining: distInput.value, date: new Date().toLocaleDateString() });
            localStorage.setItem('northArchive', JSON.stringify(archives));
            
            input.value = ''; distInput.value = ''; saveData();
            
            let title = document.getElementById('app-title');
            title.innerText = "HORIZON CLEARED";
            setTimeout(() => { title.innerText = "KAXIM TERMINAL"; }, 2000);
            rotateNeedle(0); // reset needle
        }

        function openModal() {
            if(document.getElementById('log-input').value.trim() === '') return;
            document.getElementById('modal-overlay').classList.add('show');
        }
        
        function closeModal() {
            document.getElementById('modal-overlay').classList.remove('show');
        }

        function rotateNeedle(degrees) {
            needle.style.transform = `rotate(${degrees}deg)`;
        }

        function submitLog(direction, icon) {
            closeModal();
            
            // Physics Math
            let tideMultiplier = currentTide === -1 ? 0.5 : (currentTide === 1 ? 2.0 : 1.0);
            let progress = 0;
            let needleAngle = 0;

            if(direction === 'North') {
                progress = 5 * tideMultiplier;
                needleAngle = (Math.random() * 10) - 5; // slight flutter around 0
            } else if(direction === 'Lateral') {
                progress = 1 * tideMultiplier;
                needleAngle = 45 * lateralToggle; // swings left or right
                lateralToggle *= -1;
            } else if(direction === 'Anchor') {
                progress = 0;
                needleAngle = 180; // points straight down
            }

            // Update Distance
            let currentDist = parseFloat(distInput.value) || 0;
            if(currentDist > 0) {
                let newDist = Math.max(0, currentDist - progress);
                distInput.value = newDist.toFixed(1);
                saveData();
            }

            rotateNeedle(needleAngle);

            // Log it
            let input = document.getElementById('log-input');
            const logEntry = {
                id: Date.now(), text: input.value,
                time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                color: colors[currentTide], tag: icon
            };

            let logs = JSON.parse(localStorage.getItem('wakeLogs') || '[]');
            logs.unshift(logEntry); 
            if(logs.length > 50) logs.pop(); 
            localStorage.setItem('wakeLogs', JSON.stringify(logs));

            renderLogs();
            input.value = '';
        }

        function deleteLog(id, btnElement) {
            let li = btnElement.parentElement;
            li.classList.add('dissolving');
            setTimeout(() => {
                let logs = JSON.parse(localStorage.getItem('wakeLogs') || '[]');
                logs = logs.filter(log => log.id !== id);
                localStorage.setItem('wakeLogs', JSON.stringify(logs));
                renderLogs();
            }, 400); 
        }

        function renderLogs() {
            let logs = JSON.parse(localStorage.getItem('wakeLogs') || '[]');
            let list = document.getElementById('log-list');
            list.innerHTML = '';
            logs.forEach(log => {
                const li = document.createElement('li');
                li.className = 'log-entry';
                li.style.borderLeftColor = log.color;
                li.innerHTML = `
                    <div class="log-content">
                        <div class="log-header"><span>${log.time}</span> <span>${log.tag}</span></div>
                        <div>${log.text}</div>
                    </div>
                    <button class="delete-btn" onclick="deleteLog(${log.id}, this)">×</button>
                `;
                list.appendChild(li);
            });
        }
        function loadLogs() { renderLogs(); }
    </script>
</body>
</html>
